name: drivers-vault

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drivers_vault
      POSTGRES_USER: drivers_vault
      POSTGRES_PASSWORD: drivers_vault
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivers_vault -d drivers_vault"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://drivers_vault:drivers_vault@postgres:5432/drivers_vault
      REDIS_URL: redis://redis:6379
      ACCESS_TOKEN_SECRET: local-access-token-secret
      REFRESH_TOKEN_SECRET: local-refresh-token-secret
      EMAIL_VERIFICATION_TOKEN: local-email-verification-secret
      GOOGLE_VERIFICATION_TOKEN: local-google-verification-secret
      CLIENT_URL: http://localhost:3000
      SERVER_URL: http://localhost:8080
      SEED_DRIVER_PASSWORD: ${SEED_DRIVER_PASSWORD:-LocalDrivers123!}
      SEED_DRIVER_EMAIL_CREDENTIALS: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
